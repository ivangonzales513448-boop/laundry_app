name: Deploy Ionic app to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ionic-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ionic-frontend
        run: npm ci

      - name: Build Ionic app for the GitHub Pages path
        working-directory: ionic-frontend
        run: npm run build -- --base-href /laundry_app/

      - name: Add route fallback for GitHub Pages
        run: cp ionic-frontend/dist/ionic-frontend/browser/index.html ionic-frontend/dist/ionic-frontend/browser/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ionic-frontend/dist/ionic-frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
